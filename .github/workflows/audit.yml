name: BirdingLog audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Repository invariants
        run: python3 tools/audit_repo.py

      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Compile every Lua file
        run: |
          find Dusk -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done

      - name: Persistence regression tests
        run: lua5.1 tools/test_persistence.lua

      - name: Validate plugin XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('Dusk/BirdingLog.plugin')"
